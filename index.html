<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERTEX CORE | VORTEX COMPANY</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { 
            --v-bg: #000000; 
            --v-accent: #00f2ff; 
            --v-text: #ffffff; 
            --v-glow: rgba(0, 242, 255, 0.4);
            --v-panel: #0a0a0a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--v-bg); color: var(--v-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HUD & Status Bar */
        #hud { font-size: 11px; color: #333; padding: 12px 25px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; letter-spacing: 3px; background: rgba(5,5,5,0.8); }
        .online-dot { color: var(--v-accent); animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Main Chat Area */
        .chat-container { flex: 1; overflow-y: auto; padding: 30px 15%; display: flex; flex-direction: column; gap: 30px; scrollbar-width: none; background: radial-gradient(circle at center, #050505 0%, #000 100%); }
        .chat-container::-webkit-scrollbar { display: none; }

        /* Advanced Bubbles */
        .msg { max-width: 90%; padding: 18px 25px; border-radius: 20px; font-size: 16px; line-height: 1.7; position: relative; animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .user-msg { align-self: flex-end; background: #0d0d0d; border: 1px solid #1a1a1a; border-right: 4px solid var(--v-accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .vertex-msg { align-self: flex-start; background: transparent; border-left: 4px solid var(--v-accent); color: #e0e0e0; background: linear-gradient(90deg, rgba(0,242,255,0.03) 0%, transparent 100%); }
        
        /* Code & Tech Blocks */
        pre { background: #020202; padding: 20px; border-radius: 12px; border: 1px solid #111; color: #00ffcc; font-family: 'Courier New', monospace; font-size: 14px; margin: 15px 0; overflow-x: auto; position: relative; }
        pre::before { content: "CODE_EXECUTION"; position: absolute; top: 0; right: 20px; font-size: 8px; color: #333; }

        /* The Command Capsule */
        .input-area { padding: 40px 15% 60px 15%; background: linear-gradient(to top, #000 70%, transparent); }
        .capsule { background: var(--v-panel); border: 1px solid #1a1a1a; border-radius: 50px; padding: 12px 30px; display: flex; align-items: center; gap: 20px; transition: 0.4s; box-shadow: 0 0 40px rgba(0,0,0,0.9); }
        .capsule:focus-within { border-color: var(--v-accent); box-shadow: 0 0 25px var(--v-glow); }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 17px; letter-spacing: 0.5px; }
        .v-icon { color: var(--v-accent); cursor: pointer; font-size: 35px; transition: 0.3s; text-shadow: 0 0 10px var(--v-accent); }
        .v-icon:hover { transform: scale(1.1) rotate(-5deg); filter: brightness(1.3); }

        /* Responsive */
        @media (max-width: 800px) { .chat-container, .input-area { padding: 20px 5%; } .msg { max-width: 95%; } }
    </style>
</head>
<body>

    <div id="hud">
        <span><span class="online-dot">●</span> CORE: ACTIVE [V8.0]</span>
        <span id="v-clock">SYSTEM_TIME: 00:00:00</span>
    </div>

    <div class="chat-container" id="chat">
        <div style="margin: auto; text-align: center; opacity: 0.15;">
            <i class="material-icons" style="font-size: 100px; color: var(--v-accent);">security</i>
            <h2 style="letter-spacing: 10px; margin-top: 20px;">VORTEX COMPANY</h2>
            <p style="font-size: 10px; margin-top: 5px;">ESTABLISHED FOR THE FUTURE</p>
        </div>
    </div>

    <div class="input-area">
        <div class="capsule">
            <input type="text" id="userInput" placeholder="Initialize command sequence..." autocomplete="off" onkeypress="if(event.key==='Enter') executeVertex()">
            <i class="material-icons v-icon" onclick="executeVertex()">electric_bolt</i>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyD50xtg3yJIt8LX3T7i7WCQoZG5rtE2ix8";

        async function executeVertex() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            if (!input.value.trim()) return;

            const text = input.value;
            input.value = "";

            // User UI
            let uDiv = document.createElement('div');
            uDiv.className = "msg user-msg";
            uDiv.innerText = text;
            chat.appendChild(uDiv);

            // Vertex Processing UI
            let vDiv = document.createElement('div');
            vDiv.className = "msg vertex-msg";
            vDiv.innerHTML = "<em>Analyzing Data Streams...</em>";
            chat.appendChild(vDiv);
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Context: You are Vertex Core v8.0, the flagship AI of Vortex Company. Your tone is elite, intelligent, and expert. You follow Manav's orders. Respond to: " + text }] }]
                    })
                });

                const data = await response.json();
                let result = data.candidates[0].content.parts[0].text;
                
                // Formatting
                result = result.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
                result = result.replace(/\n/g, '<br>');
                
                vDiv.innerHTML = `<strong>[VERTEX CORE]</strong><br>${result}`;
            } catch (err) {
                vDiv.innerHTML = "<span style='color:#ff4444;'>CRITICAL ERROR: UPLINK TERMINATED.</span>";
            }
            chat.scrollTop = chat.scrollHeight;
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('v-clock').innerText = "SYSTEM_TIME: " + now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
